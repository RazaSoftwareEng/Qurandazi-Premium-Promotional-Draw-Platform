# Minimal Supabase CLI config for local development (`supabase start`).
project_id = "qurandazi"

[api]
port = 54321
schemas = ["public", "storage"]

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
port = 54323

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/auth/callback", "http://localhost:5173/reset-password"]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true

# Branded email templates (for the hosted project, paste the same HTML into
# Dashboard -> Authentication -> Email Templates).
[auth.email.template.confirmation]
subject = "Verify your email to activate your QURANDAZI account"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your QURANDAZI password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = "Confirm your new QURANDAZI email address"
content_path = "./supabase/templates/email_change.html"

[functions.admin-users]
verify_jwt = true
